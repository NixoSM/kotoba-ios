name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test the dictionary engine
        run: swift test --package-path Packages/KotobaCore

  build-ipa:
    needs: test-core
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build unsigned app
        run: |
          xcodebuild -project Kotoba.xcodeproj -scheme Kotoba \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Record entitlements (App Group shared with the extensions)
        run: |
          APP=build/Build/Products/Release-iphoneos/Kotoba.app
          for ext in "$APP"/PlugIns/*.appex; do
            codesign -f -s - --entitlements "Entitlements/$(basename "$ext" .appex).entitlements" "$ext"
          done
          codesign -f -s - --entitlements Entitlements/Kotoba.entitlements "$APP"
          codesign -d --entitlements - "$APP"
      - name: Package .ipa (Sideloadly signs it with your Apple ID)
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Kotoba.app Payload/
          zip -qry Kotoba.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Kotoba-ipa
          path: Kotoba.ipa
          retention-days: 30
