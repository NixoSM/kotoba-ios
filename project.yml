name: Kotoba
options:
  bundleIdPrefix: com.nixosm
  deploymentTarget:
    iOS: "17.0"
packages:
  KotobaCore:
    path: Packages/KotobaCore
targets:
  Kotoba:
    type: application
    platform: iOS
    sources: [App/Sources]
    dependencies:
      - package: KotobaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nixosm.kotoba
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kotoba
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
