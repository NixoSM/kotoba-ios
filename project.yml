name: Kotoba
options:
  bundleIdPrefix: com.nixosm
  deploymentTarget:
    iOS: "17.0"
packages:
  KotobaCore:
    path: Packages/KotobaCore
targets:
  Kotoba:
    type: application
    platform: iOS
    sources: [App/Sources]
    dependencies:
      - package: KotobaCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Kotoba
        CFBundleDevelopmentRegion: it
        CFBundleLocalizations: [it]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: com.nixosm.kotoba
            CFBundleURLSchemes: [kotoba]
        LSApplicationQueriesSchemes: [anki]
        NSCameraUsageDescription: "Kotoba usa la fotocamera per leggere il testo giapponese e cercarlo nel dizionario."
        NSPhotoLibraryUsageDescription: "Kotoba legge il testo giapponese dalle immagini che scegli."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nixosm.kotoba
        MARKETING_VERSION: "0.6.0"
        CURRENT_PROJECT_VERSION: "6"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
