name: Kotoba
options:
  bundleIdPrefix: com.nixosm
  deploymentTarget:
    iOS: "17.0"
packages:
  KotobaCore:
    path: Packages/KotobaCore
targets:
  Kotoba:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Shared
      - App/Resources
    dependencies:
      - package: KotobaCore
      - target: KotobaShare
      - target: KotobaWidgets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Kotoba
        CFBundleDevelopmentRegion: it
        CFBundleLocalizations: [it, en, ja]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: com.nixosm.kotoba
            CFBundleURLSchemes: [kotoba]
        LSApplicationQueriesSchemes: [anki]
        NSCameraUsageDescription: "Kotoba usa la fotocamera per leggere il testo giapponese e cercarlo nel dizionario."
        NSPhotoLibraryUsageDescription: "Kotoba legge il testo giapponese dalle immagini che scegli."
        UIFileSharingEnabled: true
        UIAppFonts: [KleeOne-Regular.ttf, KleeOne-SemiBold.ttf, ShipporiMincho-Medium.ttf, ShipporiMincho-Bold.ttf, ZenMaruGothic-Medium.ttf]
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nixosm.kotoba
        CODE_SIGN_ENTITLEMENTS: Entitlements/Kotoba.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.11.0"
        CURRENT_PROJECT_VERSION: "11"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
  # "Kotoba" in the Share sheet: select text anywhere → Share → Kotoba.
  # It shows the results in a panel, so it compiles the app's search and results code.
  KotobaShare:
    type: app-extension
    platform: iOS
    sources:
      - Extensions/Share
      - App/Shared/SharedStorage.swift
      - App/Shared/URLOpener.swift
      - App/Sources/AppModel.swift
      - App/Sources/AppSettings.swift
      - App/Sources/Appearance.swift
      - App/Sources/AudioPlayer.swift
      - App/Sources/HeadwordGroup.swift
      - App/Sources/L10n.swift
      - App/Sources/Reason+Italian.swift
      - App/Sources/ResultsPage.swift
      - App/Sources/ResultsPane.swift
      - App/Sources/ResultsWebView.swift
      - App/Resources/Fonts/KleeOne-Regular.ttf
      - App/Resources/Fonts/KleeOne-SemiBold.ttf
      - App/Resources/Fonts/ShipporiMincho-Medium.ttf
      - App/Resources/Fonts/ShipporiMincho-Bold.ttf
      - App/Resources/Fonts/ZenMaruGothic-Medium.ttf
    dependencies:
      - package: KotobaCore
    info:
      path: Extensions/Share/Info.plist
      properties:
        CFBundleDisplayName: Kotoba
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIAppFonts: [KleeOne-Regular.ttf, KleeOne-SemiBold.ttf, ShipporiMincho-Medium.ttf, ShipporiMincho-Bold.ttf, ZenMaruGothic-Medium.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nixosm.kotoba.share
        CODE_SIGN_ENTITLEMENTS: Entitlements/KotobaShare.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) KOTOBA_EXTENSION"
        MARKETING_VERSION: "0.11.0"
        CURRENT_PROJECT_VERSION: "11"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
  # Control Center and Lock Screen buttons (iOS 18+).
  KotobaWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Extensions/Widgets
      - App/Shared/SharedStorage.swift
      - App/Shared/KotobaIntents.swift
    info:
      path: Extensions/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Kotoba
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nixosm.kotoba.widgets
        CODE_SIGN_ENTITLEMENTS: Entitlements/KotobaWidgets.entitlements
        MARKETING_VERSION: "0.11.0"
        CURRENT_PROJECT_VERSION: "11"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
